[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-ai"
version = "0.4.0"
description = "Explain common Linux and service incidents from log text."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Eddy105"}]
keywords = ["incident-response", "linux", "devops", "sre", "logs", "monitoring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/Eddy105/incident-ai"
Repository = "https://github.com/Eddy105/incident-ai"
Issues = "https://github.com/Eddy105/incident-ai/issues"

[project.scripts]
incident-ai = "incident_ai.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = [
  "build>=1.2,<2",
  "pytest>=8.0,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
