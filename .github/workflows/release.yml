name: Release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/incident_ai/__init__.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Determine release version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build package
        if: steps.version.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Create tag and GitHub release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "IncidentAI $TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/* --generate-notes --title "IncidentAI $TAG"
      - name: Release already exists
        if: steps.version.outputs.exists == 'true'
        run: echo "${{ steps.version.outputs.tag }} already exists; no release needed."
